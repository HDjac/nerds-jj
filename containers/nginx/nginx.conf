# Default server configuration
#


user www-data;
worker_processes 1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    #sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    resolver 127.0.0.11 valid=1m;

    # Redirect to HTTPS
    server {
        listen 80 default_server;
        server_name _;

        # Pilot 1 AI prompt ingestion.
        # Forward the actual Docker peer IP, never a client-supplied ID.
        location = /pilot1/ai-prompt {
            allow 192.168.150.0/24;
            deny all;

            proxy_set_header X-NERDS-Source-IP $remote_addr;
            proxy_set_header X-NERDS-Gateway-Token __PILOT1_AI_GATEWAY_TOKEN__;
            proxy_set_header X-Forwarded-For "";

            proxy_pass http://submit:8000;
        }

        # Browser observations use the same gateway/peer identity as AI prompts.
        # Pilot 1 clipboard ingestion uses the same trusted gateway as browser events.
        # Allow only the private participant Docker subnet, never the public HTTPS server.
        location = /pilot1/clipboard-event {
            allow 192.168.150.0/24;
            deny all;

            proxy_set_header X-NERDS-Source-IP $remote_addr;
            proxy_set_header X-NERDS-Gateway-Token __PILOT1_AI_GATEWAY_TOKEN__;
            proxy_set_header X-Forwarded-For "";

            client_max_body_size 8k;
            access_log off;
            proxy_pass http://submit:8000;
        }

        location = /pilot1/browser-event {
            allow 192.168.150.0/24;
            deny all;

            proxy_set_header X-NERDS-Source-IP $remote_addr;
            proxy_set_header X-NERDS-Gateway-Token __PILOT1_AI_GATEWAY_TOKEN__;
            proxy_set_header X-Forwarded-For "";

            client_max_body_size 16k;
            access_log off;
            proxy_pass http://submit:8000;
        }

        location ~ /(submit|get_ipynb) {
            allow 192.168.150.0/24;
            deny all;
            proxy_pass http://submit:8000;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        # SSL configuration
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

    # BEGIN NERDS COMPLETION PORTAL (managed)
    # Public, participant-neutral content only. No auth cookie or instance ID required.
    location = /study-complete {
        auth_request off;
        default_type text/html;
        alias /usr/share/nginx/html/nerds-study-complete.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /study-complete/ {
        return 302 /study-complete;
    }
    location = /study-complete-config.json {
        auth_request off;
        default_type application/json;
        alias /usr/share/nginx/html/nerds-study-complete-config.json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    # END NERDS COMPLETION PORTAL (managed)
    # A high-entropy, bearer receipt is required for completed-state lookup.
    # The host only publishes a status file after PostgreSQL commit.
    # No workspace auth cookie is required, and status filenames are not logged.
    location ~ "^/study-complete/status/([a-f0-9]{64})$" {
        auth_request off;
        alias /usr/share/nginx/html/nerds-completion-status/$1.json;
        default_type application/json;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /study-complete/status/ {
        return 404;
    }

        ssl_certificate /run/secrets/pub_cert;
        ssl_certificate_key /run/secrets/priv_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        server_name _;

        root /var/www/devob/;
        error_page 404 /static/404.html;
        error_page 500 502 503 504 /static/50x.html;

        # Internal authorization check for participant instances.
        # This endpoint cannot be requested directly by browsers.
        location = /_nerds_instance_auth {
            internal;

            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/webpageConf/authorizeInstance.php;
            fastcgi_param STUDY_ORIGINAL_URI $request_uri;
            fastcgi_param HTTP_COOKIE $http_cookie;

            fastcgi_pass_request_headers off;
            fastcgi_pass_request_body off;
            fastcgi_param CONTENT_LENGTH "";

            fastcgi_pass landing-server:9000;
        }

        # Route to index.php
        location = / {
            return 302 /index.php$is_args$args;
        }

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_intercept_errors on;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_keep_conn on;
            fastcgi_buffering off;
            fastcgi_pass landing-server:9000;
            proxy_buffering off;
            gzip off;
        }

        # Drop any requests to the notebook tree
        location ~* "/proxy/[a-f0-9]{12}/nb/tree.*$" {

            return 403 "Notebook tree access disallowed";
        }

        # Proxy notebook requests to jupyter on study instances
        location ~* "\/proxy\/([a-f0-9]{12})\/nb/(.*$)" {
            auth_request /_nerds_instance_auth;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Scheme $scheme;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_pass http://$1:8888/$2$is_args$args;
        }

        # Proxy any other requests to flask on study instances
        location ~* "\/proxy\/([a-f0-9]{12})\/(.*$)" {
            auth_request /_nerds_instance_auth;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Scheme $scheme;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_pass http://$1:60000/$2$is_args$args;

            proxy_redirect http://$1:60000/ /proxy/$1/;
        }

        # Proxy requests to submit app
        location ~ /(getcode|survey) {
            proxy_pass http://submit:8000;
        }

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one

        location ~ /\.ht {
            deny all;
        }

        location ~ /\.git {
            deny all;
        }

        location = /\config.php {
            deny all;
        }

        location /backup {
            deny all;
        }

    }
}
